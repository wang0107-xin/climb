# ruff 配置（阶段 2.1 静态分析）
#
# 为什么把 select 一条条写全，而不是靠 ruff 的默认值：
# 默认集是**跟着版本变的**。实测 ruff 0.16.9 的默认集里已经带了 I001 / BLE001 / RUF012
# 这些以前要显式开的规则 —— 哪天升个版本，"基线有多少条"就自己变了，而条数正是观察期
# 要盯的东西。写死之后，报告里条数变化只可能来自代码。
# 升 ruff 的做法：改 requirements-dev.txt 里的版本号，然后本地跑一遍
# `python ci/static_analysis.py ruff` 对比条数，差异看清楚了再提交。

target-version = "py39"   # 和容器里的 Python 3.9 对齐
line-length = 120         # 现在没开 E501，这条不影响结果；先定下来，免得以后开的时候一次性冒出几百条

[lint]
select = [
  "E4",     # import 相关：E401 一行多导入、E402 导入不在文件顶部
  "E7",     # 真错误，比如把 != 写成 <>
  "E9",     # 运行时才会炸的，比如 __future__ 位置不对
  "F",      # pyflakes：未使用的导入/变量、未定义的名字 —— 这一族最值钱
  "I",      # isort：导入顺序
  "BLE",    # 裸 except / 盲吞异常
  "TRY",    # try/except 的反模式
  "G",      # logging 用法（比如该用 logger.exception 的地方用了 .error(exc_info=True)）
  "DTZ",    # 日期时间不带时区
  "RUF012", # 类上的可变默认值（多个实例共享同一个 list/dict 那种坑）
  "RUF100", # 无用的 noqa
]

# 刻意**不**开的几族，理由各不相同 —— 留着这段是为了下次有人想加规则时先看一眼：
#
#   RUF001/002/003：把全角标点当"歧义字符"。本仓库的注释、文档字符串、提示语全是中文，
#                   实测整族开 RUF 会一次冒出 288 条，全是噪音；真正有用的 RUF012/RUF100
#                   会被埋在里面看不见。所以上面是**按单条**选的，不是按族选的 ——
#                   这一条是这轮真踩出来的，不是理论上的洁癖。
#   S：flake8-bandit，和安全扫描重复。分工是：ruff 管规范，bandit 管安全（各出一份报告）。
#   E501：行长。等哪天决定开，先看 line-length = 120 下的基线有多少条再说。
#   ANN / D / N / COM：类型注解、文档字符串、命名、尾逗号这类风格主张。
#                       它们是"团队约定"，不是"代码有问题"，一次全开会把报告淹掉。
